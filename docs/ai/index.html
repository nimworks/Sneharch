<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>:::</title>
    <style>
      ::selection {
        background-color: #ddd;
        color: #333333;
      }
      html {
        height: 100%;
      }
      body {
        font-weight: normal;
        font-family: system-ui, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        overflow-x: hidden;
        font-size: 0.75rem;
        padding: 0;
        height: 96%;
        background: #000;
        color:#fff;
      }
    </style>
    <style>
      #vizTogl {
        border: 0 none;
        background: #161616;
        position: fixed;
        top: 0;
        right: 0;
        width: 30px;
        height: 30px;
      }
    </style>
  </head>

  <body>
    <button id="vizTogl"></button>
    <main style="display: none">
      <p>Dear students, print this lab manual</p>
      <iframe src="./ai.pdf#view=FitH" width="100%" height="98%" style="border: none" title=""> </iframe>
    </main>
    <script>
      (function (d) {
        const b = d.getElementById("vizTogl"),
          mn = d.getElementsByTagName("main")[0];
        b.onclick = function () {
          mn.style.display = mn.style.display === "none" ? "unset" : "none";
        };
      })(document);
    </script>
  </body>
</html>
